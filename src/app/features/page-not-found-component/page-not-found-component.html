<main>
  <div id="notFoundPage">
    <h1 i18n="@@notFound.heading">Page not found</h1>
    <ul class="notFoundReasons">
      <li i18n="@@notFound.brokenLink">The link may be broken</li>
      <li i18n="@@notFound.urlTypo">The URL might be mistyped</li>
      <li class="pageDeletedReason" i18n="@@notFound.pageDeleted">
        The page may have been moved or deleted
      </li>
    </ul>
    <div class="notFoundMessage">
      <h2 i18n="@@notFound.code">404</h2>
      <p i18n="@@notFound.desc">
        Indicates that the browser was able to <br />communicate with the server, but the server
        <br />cound not find the requested resourse.
      </p>
    </div>
  </div>
</main>
