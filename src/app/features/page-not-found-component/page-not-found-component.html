<div id="notFoundPage">
  <h1 i18n="@@notFoundPageHeading">Page not found</h1>
  <ul class="notFoundReasons">
    <li i18n="@@notFoundReasonsBrokenLink">The link may be broken</li>
    <li i18n="@@notFoundReasonsUrlTypo">The URL might be mistyped</li>
    <li class="pageDeletedReason" i18n="@@notFoundReasonsPageDeleted">
      The page may have been moved or deleted
    </li>
  </ul>
  <div class="notFoundMessage">
    <h2 i18n="@@notFoundMessageHeading">404</h2>
    <p i18n="@@notFoundMessageDesc">
      Indicates that the browser was able to <br />communicate with the server, but the server
      <br />cound not find the requested resourse.
    </p>
  </div>
</div>
