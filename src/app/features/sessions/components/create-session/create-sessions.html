<div id="createSessionModal" class="add-modal-box">
  <div class="modal-header">
    <h3>Create Session</h3>
    <button class="close-btn" (click)="onCancel()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <form [formGroup]="createSessionForm" (ngSubmit)="onSubmit()" class="modal-body">
    <div class="time-row">
      <div class="input-group">
        <label>Start Time</label>
        <p-datepicker formControlName="startTime" inputId="calendar-timeonly" [timeOnly]="true" />
      </div>

      <div class="input-group">
        <label>End Time</label>
        <p-datepicker
          placeholder="Ongoing"
          formControlName="endTime"
          inputId="calendar-timeonly"
          [timeOnly]="true"
        />
      </div>
    </div>
    <div class="optionsRow">
      <div class="input-group">
        <label>Station</label>
        <div class="customSelect" [class.open]="isCustomSelectOpen()">
          <div class="customSelectHeading" (click)="toggleStations()">
            <p class="defaultOption">{{ selectedStationName() }}</p>
            <span class="material-symbols-outlined arrow"> expand_more </span>
          </div>
          @if (isCustomSelectOpen()) {
            <ul
              class="customSelectBody"
              animate.enter="open-animation"
              animate.leave="close-animation"
            >
              @for (station of stations(); track station.id) {
                <li (click)="selectStation(station)">
                  {{ station.name }}
                </li>
              }
            </ul>
          }
        </div>
      </div>
      <div class="input-group">
        <label>Products</label>
        <select multiple formControlName="productIds">
          <option value="101">Coca Cola</option>
          <option value="102">Snickers</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn-primary">
      {{ isSubmitting() ? 'Creating...' : 'Create Session' }}
    </button>
  </form>
</div>
