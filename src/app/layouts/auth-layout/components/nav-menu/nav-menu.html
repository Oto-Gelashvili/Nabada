<span class="material-symbols-outlined profileBtn" (click)="toggleState()" [class.open]="open()">
  {{ open() ? 'close' : 'menu' }}
</span>

@if (open()) {
  <div
    class="profileMenu"
    (click)="$event.stopPropagation()"
    animate.enter="enter-animation"
    animate.leave="leave-animation"
  >
    @if (userProfile(); as profile) {
      <p class="username">{{ profile.username }}</p>
    } @else {
      <p class="username-skeleton">Nabada User</p>
    }
    <a
      routerLink="/sessions"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="toggleState()"
      class="mobile"
      ><p i18n="@@sessionsLink">Sessions</p>
      <span class="material-symbols-outlined"> work </span>
    </a>
    <a routerLink="/products" routerLinkActive="active" (click)="toggleState()" class="mobile"
      ><p i18n="@@productsLink">Products</p>
      <span class="material-symbols-outlined"> box_add </span>
    </a>
    <a routerLink="/analytics" routerLinkActive="active" (click)="toggleState()" class="mobile"
      ><p i18n="@@analyticsLink">Analytics</p>
      <span class="material-symbols-outlined"> analytics </span>
    </a>
    <a routerLink="/settings" routerLinkActive="active" (click)="toggleState()"
      ><p i18n="@@settingLink">Settings</p>
      @if (userProfile()?.avatar_url; as avatar) {
        <img [src]="avatar" class="avatar" alt="users avatar" />
      } @else {
        <span class="material-symbols-outlined"> settings </span>
      }
    </a>
    <a routerLink="/" (click)="toggleState()"
      ><p i18n="@@HomePageLink">Home</p>
      <span class="material-symbols-outlined"> home </span>
    </a>
    <app-theme-switcher></app-theme-switcher>
    <div class="btnCont">
      <button class="logOutBtn" (click)="signOut()">
        @if (loading()) {
          <app-spinner></app-spinner>
        } @else {
          <span i18n="@@logOutBtn">Log out</span>
        }
      </button>
    </div>
  </div>
}
